<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dock Watch</title>
  <meta name="description" content="Bikeshare dock-availability and quality-control dashboard (synthetic data).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='11' r='3' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='11' r='3' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3Cpath d='M4 11l3-6h3l2 6M7 5h-2' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Pages">
      <div class="brand">
        <button class="icon-btn" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
        </button>
        <span class="brand-name">Dock Watch</span>
      </div>
      <nav id="nav"></nav>
      <div class="role">
        <label for="role">View as</label>
        <select id="role">
          <option value="analyst">Analyst</option>
          <option value="dispatcher">Dispatcher</option>
        </select>
        <p class="role-note">A view filter, not a login.</p>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Live Map</h1>
        <div class="top-controls">
          <label>Dataset <select id="dataset" aria-label="Dataset"></select></label>
          <label>Snapshot <select id="snapshot" aria-label="Snapshot time"></select></label>
          <span class="fresh" id="fresh" role="status">Loading...</span>
        </div>
      </header>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>

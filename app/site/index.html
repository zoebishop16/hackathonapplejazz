<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dock Watch</title>
  <meta name="description" content="Bikeshare dock-availability and quality-control dashboard (synthetic data).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='11' r='3' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3Ccircle cx='12' cy='11' r='3' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3Cpath d='M4 11l3-6h3l2 6M7 5h-2' fill='none' stroke='%23334' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body>
  <div class="shell" id="shell">
    <!-- Global navigation stays above the workspace on every screen size. -->
    <header class="site-header">
      <div class="brand">
        <a class="brand-name" id="home" href="#overview" title="Go to the Network Overview"><span class="brand-full">Dock Watch</span><span class="brand-short" aria-hidden="true">DW</span></a>
      </div>
      <nav id="nav" aria-label="Pages"></nav>
    </header>
    <div class="main">
      <header class="topbar">
        <div class="title-block"><h1 id="page-title">Network Overview</h1><p id="page-sub" class="page-sub"></p></div>
        <div class="top-controls">
          <label>Dataset <select id="dataset" aria-label="Dataset"></select></label>
          <label>Snapshot <select id="snapshot" aria-label="Snapshot time"></select></label>
          <span class="fresh" id="fresh" role="status">Loading...</span>
        </div>
      </header>
      <main id="page" tabindex="-1"></main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="app.js?v=26"></script>
</body>
</html>
